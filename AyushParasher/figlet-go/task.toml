schema_version = "1.4"

[task]
name = "my-org/figlet-go"
version = "1.0.0"
description = "Port pyfiglet's FIGlet renderer to Go, byte for byte."
keywords = ["go", "port", "figlet"]
[[task.authors]]
name = "ayushparasher"

[metadata]

[verifier]
# environment_mode left at its default (shared): tests are copied in only after the agent finishes.
timeout_sec = 900.0

[verifier.env]

[agent]
user = "player"
timeout_sec = 3600.0

[environment]
# Harbor 0.25 rejects "no-network" on local Docker; real tasks lock it on a cloud runner.
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
