schema_version = "1.4"
artifacts = ["/workspace/repo"]

[task]
name = "harsh/figlet-go"
version = "1.0.0"
description = "Port pyfiglet to Go with the same giant letters, spacing, and options, with Python removed."
authors = []
keywords = ["go", "porting", "figlet", "ascii-art"]

[metadata]
category = "programming"
source_repo = "https://github.com/pwaller/pyfiglet"
